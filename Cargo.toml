[package]
name = "rustweb-demo"
version = "0.1.0"
edition = "2021"
description = "Full demo web app built with rustweb 1.1"
license = "MIT OR Apache-2.0"

[dependencies]
rustweb-core = "1.1"
rustweb-macro = "1.1"
rustweb-dom = "1.1"
rustweb-router = "1.1"
rustweb-ssr = "1.1"
rustweb-ui = "1.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
